services:
  # ── Backend (FastAPI) ───────────────────────────────────────────────────────
  # Frontend is deployed separately on Vercel (see frontend/vercel.json).
  # CORS: main.py already allows any *.vercel.app + *.onrender.com + localhost via
  # regex, so CORS_ALLOW_ORIGINS/FRONTEND_URL below only need your exact prod
  # domain if you use a custom (non-*.vercel.app) domain.
  - type: web
    name: estatecfo-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: LOCAL_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL           # Supabase pooler connection string (Session mode, port 6543)
        sync: false
      - key: S3_BUCKET
        value: ""
      - key: AWS_REGION
        value: us-west-1
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: FRONTEND_URL           # your Vercel prod URL, e.g. https://rera-os-uae.vercel.app
        sync: false
      - key: CORS_ALLOW_ORIGINS     # same as FRONTEND_URL (comma-separated for multiple)
        sync: false

  # ── Frontend (optional) ────────────────────────────────────────────────────
  # Kept for a one-provider fallback. Primary deploy is Vercel.
  - type: web
    name: allinone-mis
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: estatecfo-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
