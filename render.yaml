services:
  # ── Backend (FastAPI) ───────────────────────────────────────────────────────
  - type: web
    name: estatecfo-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: starter
    region: oregon
    envVars:
      - key: AUTH_MODE
        value: local
      - key: LOCAL_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: S3_BUCKET
        value: ""
      - key: AWS_REGION
        value: us-west-1
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── Frontend (Vite/React static site) ──────────────────────────────────────
  - type: web
    name: allinone-mis
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: estatecfo-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
